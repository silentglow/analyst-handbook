<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
<title id="title">模型事故实时控制台</title>
<desc id="desc">离线 AUC 为 0.94，但模型每天输出九千二百条名单，运营只能处理八百条，实际超时率和投诉都在上升，说明模型分数与业务结果发生背离。</desc>
<defs>
 <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11141d"/><stop offset="1" stop-color="#090b10"/></linearGradient>
 <linearGradient id="red5" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fb7185" stop-opacity=".35"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></linearGradient>
 <filter id="glow5"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.ey{font-size:11px;font-weight:700;letter-spacing:2px}.title{font-size:24px;font-weight:800;fill:#fff}.label{font-size:11px;fill:#8f98ab}.value{font-size:27px;font-weight:800}.small{font-size:12px;fill:#aab2c1}.alarm{font-size:13px;font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,monospace}</style>
</defs>
<rect width="720" height="620" rx="30" fill="url(#bg5)"/><path d="M0 52H720" stroke="#fff" stroke-opacity=".08"/><circle cx="26" cy="26" r="5" fill="#fb7185"/><circle cx="44" cy="26" r="5" fill="#fbbf24"/><circle cx="62" cy="26" r="5" fill="#5eead4"/><text x="92" y="31" class="ey mono" fill="#707a8e">OPS / MODEL-INCIDENT-026</text><g transform="translate(618 14)"><rect width="76" height="25" rx="12" fill="#fb7185" fill-opacity=".12"/><circle cx="15" cy="12.5" r="4" fill="#fb7185" filter="url(#glow5)"/><text x="28" y="17" class="ey mono" fill="#fb8da0">LIVE</text></g>
<text x="32" y="91" class="ey mono" fill="#60a5fa">10:23 · FIRST EVIDENCE</text><text x="32" y="125" class="title">模型报告很漂亮，业务现场却在报警</text>
<g transform="translate(32 151)"><rect width="656" height="104" rx="18" fill="#0d1017" stroke="#fff" stroke-opacity=".08"/>
<g transform="translate(20 19)"><text class="label">离线 AUC</text><text y="45" class="value mono" fill="#5eead4">0.94</text><text y="66" class="small">报告优秀</text></g><path d="M161 16V88M322 16V88M483 16V88" stroke="#fff" stroke-opacity=".07"/>
<g transform="translate(181 19)"><text class="label">每日风险名单</text><text y="45" class="value mono" fill="#fb7185">9,200</text><text y="66" class="small">持续增长</text></g>
<g transform="translate(342 19)"><text class="label">运营容量</text><text y="45" class="value mono" fill="#fbbf24">800</text><text y="66" class="small">仅覆盖 8.7%</text></g>
<g transform="translate(503 19)"><text class="label">投诉趋势</text><text y="45" class="value mono" fill="#fb7185">↑ 32%</text><text y="66" class="small">影响扩大</text></g></g>

<g transform="translate(32 279)"><rect width="422" height="242" rx="18" fill="#0d1017" stroke="#fff" stroke-opacity=".08"/><text x="18" y="29" class="label mono">业务结果 · LAST 12 HOURS</text><path d="M42 187H397M42 55V187" stroke="#596174"/><g stroke="#fff" stroke-opacity=".055"><path d="M42 88H397M42 121H397M42 154H397"/></g><path d="M42 157C75 153 99 145 128 148C158 151 182 132 210 135C239 139 257 111 286 116C314 121 337 80 366 88C380 92 390 71 397 65" fill="none" stroke="#fb7185" stroke-width="4" filter="url(#glow5)"/><path d="M42 157C75 153 99 145 128 148C158 151 182 132 210 135C239 139 257 111 286 116C314 121 337 80 366 88C380 92 390 71 397 65L397 187H42Z" fill="url(#red5)"/><text x="42" y="213" class="label">08:00</text><text x="397" y="213" text-anchor="end" class="label">20:00</text><g transform="translate(277 35)"><rect width="111" height="31" rx="10" fill="#fb7185" fill-opacity=".12"/><text x="55" y="20" text-anchor="middle" class="alarm" fill="#ff9aaa">超时未改善 ↑</text></g></g>

<g transform="translate(474 279)"><rect width="214" height="242" rx="18" fill="#0d1017" stroke="#fb7185" stroke-opacity=".22"/><text x="18" y="29" class="label mono">CAPACITY GAP</text><text x="18" y="60" class="small">模型输出</text><rect x="18" y="72" width="178" height="28" rx="8" fill="#fb7185" fill-opacity=".12"/><rect x="18" y="72" width="178" height="28" rx="8" fill="#fb7185" fill-opacity=".45"/><text x="186" y="91" text-anchor="end" class="alarm mono" fill="#ffd3da">9,200</text><text x="18" y="127" class="small">可处理</text><rect x="18" y="139" width="178" height="28" rx="8" fill="#fff" fill-opacity=".05"/><rect x="18" y="139" width="16" height="28" rx="8" fill="#fbbf24"/><text x="186" y="158" text-anchor="end" class="alarm mono" fill="#ffd45f">800</text><path d="M18 189H196" stroke="#fff" stroke-opacity=".08"/><text x="18" y="214" class="alarm" fill="#fb8da0">缺口 8,400 笔 / 天</text></g>
<g transform="translate(70 550)"><rect width="580" height="42" rx="15" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-opacity=".22"/><circle cx="23" cy="21" r="7" fill="#fb7185"/><text x="43" y="26" class="alarm" fill="#ffd1d8">结论：离线高分 ≠ 可执行 ≠ 业务改善，立即进入事故审查</text></g>
</svg>
